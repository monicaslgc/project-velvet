name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    name: test (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run lint checks
        run: ruff check --select E4,E7,E9,F src tests examples
      - name: Run static type checks
        run: pyright src/velvet
      - name: Run tests with coverage (includes running every example script)
        run: pytest --cov=velvet --cov-report=term-missing --cov-fail-under=95
