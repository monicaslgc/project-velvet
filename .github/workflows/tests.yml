name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run lint checks
        run: ruff check --select E4,E7,E9,F src tests examples
      - name: Smoke-test agent proposal contract example
        run: python examples/evaluate_agent_proposals.py
      - name: Smoke-test end-to-end shipment walkthrough
        run: python examples/show_shipment_review.py
      - name: Run tests with coverage
        run: pytest --cov=velvet --cov-report=term-missing --cov-fail-under=75
